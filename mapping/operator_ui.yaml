version: 1

default_roles:
  - boss
  - president

roles:
  boss:
    provider: gemini
    max_turns: 1
    relay:
      enabled: true
      mode: claude_hooks
      target_role: president
      ignore_slash_commands: true
      passthrough_to_child: true
      local_ack: ""
  president:
    provider: gemini
    max_turns: 1
    relay:
      enabled: true
      mode: claude_hooks
      target_role: boss
      ignore_slash_commands: true
      passthrough_to_child: true
      local_ack: ""
  lead:
    provider: gemini
  worker-claude:
    provider: claude
    target_account: work-claude
  worker-codex:
    provider: codex
    target_account: work-codex
  worker-gemini:
    provider: gemini
  verifier:
    provider: gemini
