version: 1
providers:
  claude:
    strategy: ccs_account_profile
    command_template: "ccs {target_account}"
    session_service_user: "sam"
    session_service_group: "sam"
    session_service_supplementary_groups:
      - "mesh"
    prompt_delivery: "append_system_prompt"
    screen_profile: "claude"
    runtime_preseed: "claude"
    supports_claude_hooks: true
    exit_command: "/exit"
    notes: "Claude isolation uses real CCS account profiles created via `ccs auth create <profile>`."

  codex:
    strategy: cliproxy_provider
    command_template: "ccs codex"
    session_service_user: "mesh-worker"
    session_service_group: "mesh"
    session_service_supplementary_groups:
      - "sam"
    prompt_delivery: "stdin"
    screen_profile: "claude"
    runtime_preseed: "claude"
    supports_claude_hooks: false
    exit_command: "/exit"
    notes: "Provider-direct today. If CCS later exposes stable multi-account routing, edit this template only."

  antigravity:
    strategy: native_cli
    command_template: "/home/sam/.local/bin/agy"
    session_service_user: "sam"
    session_service_group: "sam"
    session_service_supplementary_groups:
      - "mesh"
    prompt_delivery: "prompt_interactive"
    launch_args:
      - "--dangerously-skip-permissions"
      - "--new-project"
    screen_profile: "antigravity"
    runtime_preseed: "none"
    supports_claude_hooks: false
    exit_command: "/exit"
    notes: "Native Antigravity CLI. Authentication and workspace state belong to sam; CCS is not used."
